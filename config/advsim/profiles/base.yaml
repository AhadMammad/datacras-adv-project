# Defaults shared by every profile. A profile file only lists what it changes.
seed: 42
start: "2026-01-01"          # backfill window start (end defaults to now)

fill:
  optional: 0.8              # share of nullable columns that get a value
  ref: 0.55                  # share of optional references that point at a row

org:
  employees: 60
  cost_centers: 12

clients:
  advertisers: 30
  holding_groups: 4          # advertisers grouped under holding companies
  brands_per_advertiser: [1, 4]
  annual_media_budget: 1_500_000   # median per advertiser (lognormal)
  churn_rate: 0.08           # share of advertisers that churned during the window

supply:
  publishers: 18
  tech_partners: 8
  production_vendors: 5
  data_suppliers: 3
  properties_per_publisher: [1, 4]
  placements_per_property: [2, 5]

audiences:
  taxonomy_nodes: 24
  segments: 40
  personas: 12
  members_per_segment: [20, 60]

campaigns:
  per_advertiser_per_month: 0.6
  duration_days: [21, 120]
  flights: [1, 3]
  line_items_per_flight: [2, 5]
  ads_per_line_item: [1, 3]
  budget_median: 180_000     # USD per campaign (lognormal)
  lead_days: [14, 45]        # brief -> campaign start

delivery:
  sample_rate: 2000          # one stored event row stands for this many real events
  cpm: {display: 6.5, video: 18.0, ctv: 32.0, native: 8.0, audio: 12.0, social: 7.5, dooh: 9.0}
  ctr: {display: 0.0012, video: 0.004, ctv: 0.0005, native: 0.0025, audio: 0.0006, social: 0.009, dooh: 0.0}
  cvr: 0.025                 # conversions per click (plus view-through below)
  view_through_rate: 0.00004 # view-through conversions per impression
  viewability: {display: 0.62, video: 0.71, ctv: 0.93, native: 0.66, audio: 0.0, social: 0.68, dooh: 0.0}
  video_completion: 0.72
  pacing_noise: 0.18         # daily lognormal sigma around the pacing curve
  weekday_factor: [1.0, 1.04, 1.05, 1.03, 0.98, 0.86, 0.84]   # Mon..Sun
  q4_uplift: 1.25
  max_events_per_day: 400000 # safety cap on stored rows per day (all tables)

finance:
  invoice_lag_days: [2, 6]
  payment_lag_days: [25, 65]
  vendor_variance_sigma: 0.025
  dispute_rate: 0.06

stream:
  tick_seconds: 1.0
  new_advertisers_per_day: 0.2
  new_campaigns_per_day: 1.5
  new_suppliers_per_day: 0.1
  lifecycle_checks_per_minute: 30
  delete_rate_per_hour: 6
  deletable:                 # leaf rows that systems really delete (drafts, superseded links)
    targeting_rule: {}
    assignment: {column: assignment_status, values: [cancelled, reassigned]}
    time_entry: {column: approval_status, values: [draft, rejected]}
    segment_membership: {column: membership_status, values: [expired, excluded]}
