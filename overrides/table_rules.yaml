# Per-table strictness rules, curated from the MVM descriptions.
#   unique:   business/natural keys -> NOT NULL + UNIQUE (list of column lists)
#   required: identifying attributes -> NOT NULL
#   status:   primary lifecycle status column -> NOT NULL
# Keys are "<mvm_domain>.<mvm_product>". Column names are OLTP names
# (after audit renames). Unknown columns fail the build.

campaign.budget_allocation:      {status: allocation_status}
campaign.campaign:               {unique: [[campaign_code]], required: [campaign_name, start_date], status: campaign_status}
campaign.campaign_kpi_target:    {status: target_status}
campaign.flight:                 {unique: [[flight_code]], required: [flight_name, start_date, end_date], status: flight_status}
campaign.pacing_rule:            {required: [rule_name], status: pacing_status}
campaign.targeting_rule:         {required: [rule_name]}
campaign.ad:                     {required: [ad_name], status: ad_status}
campaign.creative_assignment:    {status: trafficking_status}
campaign.line_item:              {unique: [[line_item_code]], required: [line_item_name, start_date, end_date], status: delivery_status}
campaign.trafficking_order:      {unique: [[trafficking_order_number]], status: trafficking_status}

