[project]
name = "advsim"
version = "0.1.0"
description = "Simulates realistic advertising-agency data into the six source-system PostgreSQL databases"
requires-python = ">=3.12"
dependencies = [
    "advgen",
    "faker>=30.0",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.scripts]
advsim = "advsim.cli:main"

[tool.uv.sources]
advgen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advsim"]
