[project]
name = "advgen"
version = "0.1.0"
description = "Generates PostgreSQL source-system OLTP models from the Databricks Advertising MVM lakehouse model"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
advgen = "advgen.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator/advgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
