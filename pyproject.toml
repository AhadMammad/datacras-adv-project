# uv workspace root (virtual). Members live under packages/.
#   advgen: generates the OLTP source-system models from the Advertising MVM
#   advsim: simulates realistic data into the six source databases

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.0", "advgen", "advsim"]

[tool.uv.sources]
advgen = { workspace = true }
advsim = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/advsim/tests"]
markers = ["pg: needs the six PostgreSQL instances and TRUNCATES them; run with `pytest -m pg`"]
addopts = "-m 'not pg'"
